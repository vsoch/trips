<style>
/* Layout: trail-map app. Zoomable map on the left; on the right a basecamp panel with tabs (Plan, Day trips, Drive & charge, Snow driving). Phones: map on top, panel below. */
:root {
  --paper: #eef0ec;
  --panel: #fafbf8;
  --land: #e4e6dc;
  --water: #c3d6dd;
  --county: #b8bcae;
  --ink: #1b2622;
  --muted: #5b6862;
  --line: #d3d8cf;
  --pine: #275c43;
  --granite: #6c7a78;
  --volt: #e0a100;
  --volt-ink: #261c00;
  --base: #b5372e;
  --c-snow: #2f78b7;
  --c-falls: #138a85;
  --c-trees: #a4502a;
  --c-easy: #6a6f5a;
  --c-evening: #6d4bb8;
  --font-display: "Overpass", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Overpass", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11171a; --panel: #172024; --land: #232c2c; --water: #12303c; --county: #3a4745; --ink: #e7ece6;
    --muted: #9aa8a3; --line: #2d393a; --pine: #5cc08f; --granite: #9aa9a7; --volt: #f2b928; --volt-ink: #201800; --base: #ef6a5e;
    --c-snow: #73b4ef; --c-falls: #49c7c0; --c-trees: #e08a5c; --c-easy: #b4b99e; --c-evening: #ab92f3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11171a; --panel: #172024; --land: #232c2c; --water: #12303c; --county: #3a4745; --ink: #e7ece6;
  --muted: #9aa8a3; --line: #2d393a; --pine: #5cc08f; --granite: #9aa9a7; --volt: #f2b928; --volt-ink: #201800; --base: #ef6a5e;
  --c-snow: #73b4ef; --c-falls: #49c7c0; --c-trees: #e08a5c; --c-easy: #b4b99e; --c-evening: #ab92f3;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, select, input { font: inherit; color: inherit; }
select, input { box-sizing: border-box; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 460px; height: 100%; }
#map { height: 100%; min-height: 0; background: var(--land); }
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.scroll { overflow-y: auto; flex: 1; min-height: 0; }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  #map { height: 52vh; min-height: 320px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .scroll { overflow: visible; }
}
.gut { padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.top { padding-block: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.titlerow { display: flex; align-items: center; gap: 12px; }
.badge { flex: none; width: 38px; height: 38px; display: grid; place-items: center; background: var(--pine); border-radius: 8px; }
h1 { font: 900 24px/1.05 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.sub { font: 400 12.5px var(--font-mono); color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-bottom: -1px; }
.tab { flex: none; border: 1px solid transparent; border-bottom: 0; background: transparent; border-radius: 8px 8px 0 0; padding: 7px 9px 8px; cursor: pointer; font-weight: 800; font-size: 13.5px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); border-color: var(--line); box-shadow: inset 0 3px 0 var(--pine); }
.tab:focus-visible, .btn:focus-visible, .chip:focus-visible, .trip:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; }

.body { padding-block: 16px 30px; display: grid; gap: 20px; }
.eyebrow { font: 600 11px var(--font-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
h2 { font: 900 22px/1.15 var(--font-display); margin: 2px 0 0; text-wrap: balance; }
h3 { font: 800 12px var(--font-display); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 0 0 8px; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.facts div { padding: 8px 10px; border-right: 1px solid var(--line); min-width: 0; }
.facts div:last-child { border-right: 0; }
.facts dt { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 0; font: 800 16px/1.25 var(--font-display); font-variant-numeric: tabular-nums; }

/* planner */
.plan { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.plan > li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.plan .dt { font: 600 12.5px/1.3 var(--font-mono); }
.plan .dt small { display: block; color: var(--muted); font-weight: 400; }
.plan .slots { display: grid; gap: 6px; min-width: 0; }
.plan .fixed { font-weight: 800; }
.plan .fixed span { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; }

    { id: "puffy", t: "Insulated mid-layer (fleece or puffy)", d: "Days run 30s–40s °F up high; colder after dark." },
    { id: "base", t: "Base layers, top and bottom", d: "Merino or synthetic, not cotton." },
    { id: "boots", buy: true, t: "Waterproof insulated boots", d: "Snowshoes strap onto these. Plus wool socks and a spare pair." },
    { id: "hands", t: "Waterproof gloves, beanie, neck gaiter", d: "Bring a dry spare pair of gloves for tubing." },
    { id: "sun", t: "Sunglasses & sunscreen", d: "Snow glare is strong on clear days." },
  ]},
  { group: "For the trail", items: [
    { id: "spikes", buy: true, t: "Microspikes", d: "Slip-on traction for icy trails like Mariposa Grove and Chilnualna." },
    { id: "poles", t: "Trekking poles", d: "Helpful on snow; Badger Pass rents poles with snowshoes." },
    { id: "lamp", t: "Headlamp", d: "Dark by about 5 PM." },
    { id: "pack", t: "Daypack, thermos, hand warmers", d: "" },
    { id: "snowshoes", rent: true, t: "Snowshoes / cross-country skis", d: "Rent at the Badger Pass Nordic Center, so no need to buy." },
    { id: "sled", t: "Sled or saucer for Goat Meadow", d: "Optional; Oakhurst stores sell them in winter." },
  ]},
  { group: "Health & hotel", items: [
    { id: "masks", t: "Masks", d: "For indoor stops: visitor centers, shops, charging-stop restrooms." },
    { id: "hepa", t: "Small portable HEPA purifier (optional)", d: "Runs in the room alongside the wall unit." },
    { id: "plugs", t: "Earplugs", d: "In case the hotel walls are thin." },
  ]},
];
function renderGear() {
  const all = GEAR.flatMap(g => g.items); const done = all.filter(i => gearDone[i.id]).length;
  bodyEl.innerHTML = `
    <div><div class="eyebrow">Packing &amp; ordering checklist</div><h2>What to bring for a snow week</h2>
      <p class="lede">You don't need a one-piece snowsuit. Waterproof snow pants plus a shell jacket over layers does everything a snowsuit does, and works on rainy days too. Items tagged <span class="tag buy">order</span> are worth buying ahead; <span class="tag rent">rent</span> means rent there.</p></div>
    <div><div class="row" style="justify-content:space-between"><span class="note">${done} of ${all.length} packed</span><button type="button" class="btn" id="gear-reset">Clear checks</button></div><div class="progress" style="margin-top:6px"><b style="width:${Math.round(done / all.length * 100)}%"></b></div></div>
    ${GEAR.map(g => `<section><h3>${esc(g.group)}</h3><ul class="checks">${g.items.map(i => `<li><label for="g-${i.id}"><input type="checkbox" id="g-${i.id}" data-g="${i.id}"${gearDone[i.id] ? " checked" : ""}><span><b>${esc(i.t)}</b>${i.buy ? '<span class="tag buy" style="display:inline-block">order</span>' : ""}${i.rent ? '<span class="tag rent" style="display:inline-block">rent</span>' : ""}${i.d ? `<span>${esc(i.d)}</span>` : ""}</span></label></li>`).join("")}</ul></section>`).join("")}
    <p class="note">Chain rules: <a href="https://www.nps.gov/yose/planyourvisit/chains.htm" target="_blank" rel="noopener" style="color:var(--pine)">NPS tire chain requirements ↗</a></p>`;
  bodyEl.querySelectorAll("[data-g]").forEach(c => c.addEventListener("change", () => { gearDone[c.dataset.g] = c.checked; store.set("oh-gear", gearDone); const y = document.getElementById("scroll").scrollTop; renderGear(); document.getElementById("scroll").scrollTop = y; const again = document.getElementById("g-" + c.dataset.g); if (again) again.focus({ preventScroll: true }); }));
  document.getElementById("gear-reset").addEventListener("click", () => { for (const k in gearDone) delete gearDone[k]; store.set("oh-gear", gearDone); renderGear(); });
}

const storyLayer = L.layerGroup();
const storyMarkers = [];
STORIES.forEach((st, i) => {
  const m = L.marker(st.ll, { title: st.title, zIndexOffset: 900,
    icon: L.divIcon({ className: "mk", html: `<div class="mk-story">${esc(st.yr.replace(" yrs", ""))}</div>`, iconSize: [0, 0], iconAnchor: [0, 0] }) });
  m.bindPopup(`<div class="pk">${esc(st.yr)} · ${esc(st.place)}</div><b>${esc(st.title)}</b><div>${esc(st.text)}</div><div style="margin-top:6px"><a href="${st.src}" target="_blank" rel="noopener">Source ↗</a></div>`, { maxWidth: 300 });
  m.on("click", () => { const el = document.querySelector(`[data-story="${i}"]`); if (el && !isNarrow()) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
  m.addTo(storyLayer); storyMarkers.push(m);
});
function renderStories() {
  const order = STORIES.map((st, i) => [st, i]).sort((a, b) => a[0].sort - b[0].sort);
  bodyEl.innerHTML = `
    <div><div class="eyebrow">History around your base</div><h2>Stories of the southern Sierra</h2>
      <p class="lede">From Chukchansi homelands to gold camps, a 54-mile lumber flume and California's first ski school. Oldest first; tap one to see where it happened.</p></div>
    <ol class="tl">${order.map(([st, i]) => `<li data-story="${i}">
      <span class="yr">${esc(st.yr)}</span>
      <div><button type="button" class="st" data-si="${i}">${esc(st.title)}</button><span class="pl">${esc(st.place)}</span>
      <p>${esc(st.text)}</p><a class="src" href="${st.src}" target="_blank" rel="noopener">Source ↗</a></div></li>`).join("")}</ol>`;
  bodyEl.querySelectorAll("[data-si]").forEach(b => b.addEventListener("click", () => {
    const st = STORIES[+b.dataset.si]; map.flyTo(st.ll, Math.max(map.getZoom(), 11), { duration: 0.5 });
    setTimeout(() => storyMarkers[+b.dataset.si].openPopup(), 550);
    if (isNarrow()) document.getElementById("map").scrollIntoView({ behavior: "smooth" });
  }));
}

function setView(v, keepMap) {
  if (!keepMap) map.closePopup();
  view = v; store.set("oh-view", v);
  if (v === "stories") { storyLayer.addTo(map); tripLayer.remove(); } else { storyLayer.remove(); if (!map.hasLayer(tripLayer)) tripLayer.addTo(map); }
  tabsEl.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === v));
  if (v === "plan") { renderPlan(); if (!keepMap) { highlight([], null); fit(AREA); } }
  else if (v === "trips") { renderTrips(); if (!keepMap) { selected = null; highlight([], null); fit(AREA); } }
  else if (v === "drive") renderDrive();
  else if (v === "gear") { renderGear(); if (!keepMap) { highlight([], null); fit(AREA); } }
  else if (v === "stories") { renderStories(); if (!keepMap) { highlight([], null); fit(L.latLngBounds([[37.25, -119.99], [37.73, -119.55]])); } }
  else renderSnow();
  if (!keepMap) document.getElementById("scroll").scrollTop = 0;
}

map.fitBounds(AREA);
updTowns();
setView(["plan","trips","stories","drive","snow","gear"].includes(view) ? view : "plan");
window.addEventListener("resize", () => map.invalidateSize());
</script>
